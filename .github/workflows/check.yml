name: camp-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: camp-watch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: check every 1 minute (4 times per run)
        run: |
          for i in 1 2 3 4; do
            python check_camp.py || echo "check failed"
            if [ "$i" -lt 4 ]; then sleep 60; fi
          done
        env:
          TARGETS: ${{ vars.TARGETS }}
          PLAN_FILTER: ${{ vars.PLAN_FILTER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
